[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divmon"
version = "0.1.0"
description = "Monitor de solo lectura para una cartera de dividendos en Interactive Brokers"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "Jinja2>=3.1",
    "matplotlib>=3.8",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
gateway = ["ib_async>=1.0"]
pdf = ["weasyprint>=60"]
dev = ["pytest>=8"]

[project.scripts]
divmon = "divmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
divmon = ["report/templates/*.j2", "schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
